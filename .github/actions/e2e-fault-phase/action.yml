name: 실제 배포 장애 적용·복원
description: AWS OIDC를 갱신해 한 가지 실제 장애 시나리오와 정상 복구를 검증합니다.
inputs:
  mode:
    description: 원격 임시 장애 모드
    required: true
  scenario:
    description: 검증할 시나리오 ID
    required: true
  region:
    description: 고정 AWS 리전
    required: true
  instance-id:
    description: 전용 E2E EC2 인스턴스 ID
    required: true
  role-arn:
    description: GitHub OIDC 배포 역할 ARN
    required: true
runs:
  using: composite
  steps:
    - name: AWS OIDC 자격 갱신
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
    - name: 장애 시험·원복·복구 채팅 검증
      shell: bash
      env:
        E2E_FAULT_MODE: ${{ inputs.mode }}
        E2E_SCENARIO_ID: ${{ inputs.scenario }}
        E2E_AWS_REGION: ${{ inputs.region }}
        E2E_EC2_INSTANCE_ID: ${{ inputs.instance-id }}
      run: bash scripts/e2e/run_fault_phase.sh
