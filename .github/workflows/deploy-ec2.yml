name: EC2 자동 배포

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    name: main 브랜치를 EC2에 배포
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: AWS OIDC 인증
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: EC2 배포
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SECRET_PARAMETER: ${{ vars.ENV_PARAMETER_NAME }}
        run: |
          bash scripts/ec2/run_ec2_deploy.sh \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --branch main \
            --secret-parameter "$SECRET_PARAMETER" \
            --wait-seconds 900
